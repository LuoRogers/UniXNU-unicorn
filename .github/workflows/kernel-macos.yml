name: kernel-macos

# unicorn（小米 12S Pro / SM8475）darwin24 内核与启动镜像，在 GitHub 托管的 macOS runner 上构建。
#
# 为什么用 macOS：darwin24 的内核编链（kits/PongPlatform24 的 build-ipados18-pong-macos.py）
# 依赖 Xcode 的 iphoneos SDK 与 xcrun 工具（ld64/libtool/mig/ibtool）；
# 在 Linux 上只能编到"公开头与源码两套 `_ut` 类型打架"那一步（见 docs/08）。
#
# 触发：Actions → kernel-macos → Run workflow。
# 需要仓库 secret：UNIXNU_UNIQUE_CHIP_ID（8 位十六进制，本机芯片种子）。

on:
  workflow_dispatch:
    inputs:
      os_profile:
        description: "OS profile"
        required: true
        default: "ipados-18.7.10-22H374"
        type: choice
        options: ["ipados-18.7.10-22H374"]
      prelink:
        description: "是否做 prelink（首次先 false，用原生内核）"
        required: true
        default: false
        type: boolean

env:
  DEVICE: unicorn
  OS_PROFILE: ${{ inputs.os_profile }}
  # 与设备仓 migration/format2/migration-state.json 的 upstream_revision 保持一致
  UNIXNU_REF: 0fc0fc1f9ddd0fbd4787738afef38667df5e0a95

jobs:
  kernel:
    name: kernel + payload + boot image
    runs-on: macos-15-intel
    timeout-minutes: 240
    steps:
      - name: checkout device repository
        uses: actions/checkout@v4
        with:
          path: device

      - name: checkout UniXNU framework (pinned)
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ env.UNIXNU_REF }}
          path: UniXNU

      - name: setup python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: reclaim disk
        run: |
          sudo rm -rf /Users/runner/Library/Developer/CoreSimulator \
                      /Applications/Xcode_15*.app 2>/dev/null || true
          df -h /

      - name: select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: platform seed (secret)
        env:
          CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          case "${CHIP_ID}" in
            [0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]) ;;
            *) echo 'secret UNIXNU_UNIQUE_CHIP_ID 必须是 8 位十六进制' >&2; exit 1 ;;
          esac
          printf '%s\n' "${CHIP_ID}" > device/.unique-chip-id

      - name: bootstrap (pin / soc seed / profile / defconfig / fetch)
        working-directory: device
        run: |
          python3.12 -m pip install --quiet --upgrade pip
          bash scripts/bootstrap-unicorn.sh --unixnu ../UniXNU --soc ../soc-seed

      # 内核步骤要求 cmake / ninja / unifdef；设备仓的 kit 构建还要 dtc。
      - name: install build tools
        run: |
          brew install --quiet cmake ninja unifdef dtc
          for t in cmake ninja unifdef dtc; do command -v "$t" || exit 1; done

      - name: pin baseline machine config (BCM2837 -> PONG)
        working-directory: device
        run: |
          bash scripts/pin-baseline-machine-config.sh ../UniXNU

      - name: build kernel
        working-directory: UniXNU
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/device
        run: |
          python3.12 ./unixnu build kernel -D ../device
          ls -l ../UniXNU/out/unicorn/${OS_PROFILE}/unicorn_ipados18/kernel/ || true

      - name: build payload
        working-directory: UniXNU
        run: |
          python3.12 ./unixnu payload -D ../device
          ls -l ../UniXNU/out/unicorn/${OS_PROFILE}/unicorn_ipados18/payload/ || true

      # 注意：这里不能用 `unixnu bootimg`——框架那个只支持 v0–v2 头（verify() 按 v0 偏移解析），
      # 而 unicorn 的 ABL 需要 Android boot header v4，且 ramdisk 必须是 payload
      # （UniXNU 菜单的启动项来自 ramdisk 里的 EFI/UniXNU/Payloads/kernel.macho）。
      # scripts/make-m3-image.sh 用固件仓的 build-bootimg.py 打 v4，并做结构自校验。
      # 固件（SILICIUM_UEFI.fd）在 WSL 里编好、不进 CI，所以这一步有产物时才打包。
      # 内核与 payload 一定会产出；引导镜像可在本地用同一条脚本组装：
      #   bash scripts/make-m3-image.sh --payload <payload.img>
      - name: build boot image (v4, payload as ramdisk; needs a prebuilt firmware volume)
        working-directory: device
        run: |
          FD=../uefi-unicorn/Build/unicornPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
          if [ ! -f "$FD" ]; then
            echo "跳过打包：CI 里没有 ${FD}（固件在本地编）。"
            echo "本地组装： bash scripts/make-m3-image.sh --payload ../UniXNU/out/unicorn/${OS_PROFILE}/unicorn_ipados18/payload/payload.img"
            exit 0
          fi
          bash scripts/make-m3-image.sh \
            --payload ../UniXNU/out/unicorn/${OS_PROFILE}/unicorn_ipados18/payload/payload.img \
            --out ../UniXNU/out/unicorn/${OS_PROFILE}/unicorn_ipados18/boot-m3
          ls -l ../UniXNU/out/unicorn/${OS_PROFILE}/unicorn_ipados18/boot-m3/

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unicorn-kernel-payload-boot
          path: |
            UniXNU/out/unicorn/**/kernel/*
            UniXNU/out/unicorn/**/payload/*
            UniXNU/out/unicorn/**/boot/*.img
            UniXNU/out/unicorn/**/boot-m3/*.img
            UniXNU/out/unicorn/**/device-tree/*
            UniXNU/out/unicorn/**/logs/*
          if-no-files-found: warn
          retention-days: 14
